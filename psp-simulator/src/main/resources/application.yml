server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: psp-simulator
  threads:
    virtual:
      enabled: true
  main:
    keep-alive: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO
    pe.axiz: INFO
